name: Tor Binary Builder

on:
  workflow_dispatch:

env:
  TOR_VERSION: "0.4.9.15"

jobs:
  build-armhf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile Tor inside Docker (ARMhf)
        run: |
          docker run --rm --pull always --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/work \
            debian:bullseye-slim \
            bash -c "
              export DEBIAN_FRONTEND=noninteractive
              echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list
              echo 'deb http://archive.debian.org/debian-security bullseye-security main' >> /etc/apt/sources.list
              echo 'Acquire::Check-Valid-Time \"false\";' > /etc/apt/apt.conf.d/99-no-check-valid-time

              apt-get update && apt-get install -y build-essential libevent-dev libssl-dev zlib1g-dev wget ca-certificates make
              cd /work
              
              if [ ! -d \"tor-${{ env.TOR_VERSION }}\" ]; then
                wget --no-check-certificate https://dist.torproject.org/tor-${{ env.TOR_VERSION }}.tar.gz
                tar -xzf tor-${{ env.TOR_VERSION }}.tar.gz
              fi

              cd tor-${{ env.TOR_VERSION }}
              ./configure --disable-asciidoc
              make -j$(nproc)
            "

      - name: Package ARMhf Binary
        run: |
          mkdir -p dist-armhf
          TOR_BIN=$(find . -name "tor" -type f -path "*/src/*" | head -n 1)
          cp "$TOR_BIN" dist-armhf/tor
          chmod +x dist-armhf/tor
          sudo apt-get update && sudo apt-get install -y zip
          cd dist-armhf
          zip tor-${{ env.TOR_VERSION }}_armv7l.zip tor

      - name: Upload ARMhf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-binary-armhf
          path: dist-armhf/tor-${{ env.TOR_VERSION }}_armv7l.zip

  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Tor inside Docker (AMD64 Bullseye)
        run: |
          docker run --rm --pull always --platform linux/amd64 \
            -v ${{ github.workspace }}:/work \
            debian:bullseye-slim \
            bash -c "
              export DEBIAN_FRONTEND=noninteractive
              echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list
              echo 'deb http://archive.debian.org/debian-security bullseye-security main' >> /etc/apt/sources.list
              echo 'Acquire::Check-Valid-Time \"false\";' > /etc/apt/apt.conf.d/99-no-check-valid-time

              apt-get update && apt-get install -y build-essential libevent-dev libssl-dev zlib1g-dev wget ca-certificates make
              cd /work
              
              if [ ! -d \"tor-${{ env.TOR_VERSION }}\" ]; then
                wget --no-check-certificate https://dist.torproject.org/tor-${{ env.TOR_VERSION }}.tar.gz
                tar -xzf tor-${{ env.TOR_VERSION }}.tar.gz
              fi

              cd tor-${{ env.TOR_VERSION }}
              ./configure --disable-asciidoc
              make -j$(nproc)
            "

      - name: Package AMD64 Binary
        run: |
          mkdir -p dist-amd64
          TOR_BIN=$(find . -name "tor" -type f -path "*/src/*" | head -n 1)
          cp "$TOR_BIN" dist-amd64/tor
          chmod +x dist-amd64/tor
          sudo apt-get update && sudo apt-get install -y zip
          cd dist-amd64
          zip tor-${{ env.TOR_VERSION }}_amd64.zip tor

      - name: Upload AMD64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-binary-amd64
          path: dist-amd64/tor-${{ env.TOR_VERSION }}_amd64.zip

  release:
    needs: [build-armhf, build-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Release and Upload Both Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/tor-binary-armhf/tor-${{ env.TOR_VERSION }}_armv7l.zip
            all-artifacts/tor-binary-amd64/tor-${{ env.TOR_VERSION }}_amd64.zip
          tag_name: v${{ env.TOR_VERSION }}
          name: "Tor v${{ env.TOR_VERSION }}"
          body: "Automatisch kompilierte Tor-Versionen für ARMhf (Raspberry Pi) und AMD64 (Bullseye)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
