name: Tor Binary Builder
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install Architecture Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support

    - name: Build Tor inside ARMhf Container
      run: |
        docker run --rm --privileged -v ${{ github.workspace }}:/dist multiarch/debian-debootstrap:armhf-bullseye /bin/bash -c "
          apt-get update && apt-get install -y build-essential libssl-dev libevent-dev zlib1g-dev wget ca-certificates
          cd /tmp
          wget --no-check-certificate https://www.torproject.org/dist/tor-0.4.9.15.tar.gz
          tar -xf tor-0.4.9.15.tar.gz
          cd tor-0.4.9.15
          ./configure --disable-asciidoc
          make -j$(nproc)
          cp src/app/main/tor /dist/tor-ch
        "

    - name: Upload Finished Binary
      uses: actions/upload-artifact@v4
      with:
        name: tor-binary-armhf
        path: tor-ch
