name: Tor Binary Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile Tor inside Docker (ARMhf)
        run: |
          docker run --rm --pull always --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/work \
            debian:bullseye-slim \
            bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential \
                libevent-dev \
                libssl-dev \
                zlib1g-dev \
                wget \
                ca-certificates \
                make

              cd /work
              
              # Quellcode herunterladen und entpacken, falls noch nicht geschehen
              if [ ! -d \"tor-0.4.9.15\" ]; then
                wget --no-check-certificate https://dist.torproject.org/tor-0.4.9.15.tar.gz
                tar -xzf tor-0.4.9.15.tar.gz
              fi

              cd tor-0.4.9.15
              ./configure --disable-asciidoc
              make -j$(nproc)
            "

      - name: Copy Tor binary safely
        run: |
          mkdir -p /dist
          # Sucht automatisch nach der kompilierten 'tor'-Datei im Quellcode-Ordner
          TOR_BIN=$(find . -name "tor" -type f -path "*/src/*" | head -n 1)
          
          if [ -z "$TOR_BIN" ]; then
            echo "Fehler: Tor-Binärdatei wurde nicht gefunden!"
            exit 1
          fi
          
          echo "Gefunden unter: $TOR_BIN"
          cp "$TOR_BIN" /dist/tor-ch
          chmod +x /dist/tor-ch

      - name: Upload Tor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-binary-armhf
          path: /dist/tor-ch
