name: Tor Binary Builder

on:
  workflow_dispatch:

env:
  TOR_VERSION: "0.4.9.15"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile Tor inside Docker (ARMhf)
        run: |
          docker run --rm --pull always --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/work \
            debian:bullseye-slim \
            bash -c "
              export DEBIAN_FRONTEND=noninteractive
              
              echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list
              echo 'deb http://archive.debian.org/debian-security bullseye-security main' >> /etc/apt/sources.list
              echo 'Acquire::Check-Valid-Time \"false\";' > /etc/apt/apt.conf.d/99-no-check-valid-time

              apt-get update && apt-get install -y \
                build-essential \
                libevent-dev \
                libssl-dev \
                zlib1g-dev \
                wget \
                ca-certificates \
                make

              cd /work
              
              if [ ! -d \"tor-${{ env.TOR_VERSION }}\" ]; then
                wget --no-check-certificate https://dist.torproject.org/tor-${{ env.TOR_VERSION }}.tar.gz
                tar -xzf tor-${{ env.TOR_VERSION }}.tar.gz
              fi

              cd tor-${{ env.TOR_VERSION }}
              ./configure --disable-asciidoc
              make -j$(nproc)
            "

      - name: Copy Tor binary safely
        run: |
          mkdir -p dist
          TOR_BIN=$(find . -name "tor" -type f -path "*/src/*" | head -n 1)
          
          if [ -z "$TOR_BIN" ]; then
            echo "Fehler: Tor-Binärdatei wurde nicht gefunden!"
            exit 1
          fi
          
          echo "Gefunden unter: $TOR_BIN"
          cp "$TOR_BIN" dist/tor
          chmod +x dist/tor

      - name: Upload Tor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-binary-armhf
          path: dist/tor

      - name: Package and Release Binary
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          cd dist
          zip tor-${{ env.TOR_VERSION }}_armv7l.zip tor

      - name: Release and Upload Zipped Binary
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tor-${{ env.TOR_VERSION }}_armv7l.zip
          tag_name: v${{ env.TOR_VERSION }}
          name: "Tor v${{ env.TOR_VERSION }} (ARMhf)"
          body: "Automatisch kompilierte und komprimierte Tor-Version ${{ env.TOR_VERSION }} für den Raspberry Pi (ARMhf/ARMv7)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
